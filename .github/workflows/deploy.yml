name: Deploy frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Configure production environment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          test -n "$FRONTEND_ENV" || { echo 'FRONTEND_ENV secret is missing'; exit 1; }
          printf '%s\n' "$FRONTEND_ENV" > .env.production.local
      - name: Build frontend
        run: npm run build
      - name: Deploy over SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY"
          key="$RUNNER_TEMP/stoq-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          tar -czf "$RUNNER_TEMP/$release.tar.gz" -C dist .
          options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" -o ConnectTimeout=15)
          scp "${options[@]}" "$RUNNER_TEMP/$release.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/var/www/stoq/incoming/$release.tar.gz"
          ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "/usr/local/bin/stoq-deploy $release"
          actual=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "http://$DEPLOY_HOST/deploy-version.txt")
          test "$actual" = "$GITHUB_SHA"
          echo "Deployed $GITHUB_SHA"
