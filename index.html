<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        var colorScheme = localStorage.getItem("stoq-color-scheme") || "light";
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          colorScheme === "dark" ? "dark" : "light",
        );
      } catch (error) {
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          "light",
        );
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, user-scalable=no"
    />
    <link href="/src/app/classes/index.css" rel="stylesheet" />
    <title>STOQ - умное управление рестораном</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
